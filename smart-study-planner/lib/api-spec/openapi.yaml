openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Smart Study Planner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Task management
  - name: subtasks
    description: Subtask management
  - name: user
    description: User profile and streaks
  - name: stats
    description: Productivity statistics
  - name: quotes
    description: Motivational quotes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [study, work, personal, health, finance, hobby, social]
        - name: priority
          in: query
          schema:
            type: string
            enum: [high, medium, low]
        - name: completed
          in: query
          schema:
            type: boolean
        - name: parentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    put:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/complete:
    patch:
      operationId: toggleTaskComplete
      tags: [tasks]
      summary: Toggle task completion status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleCompleteBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/subtasks:
    get:
      operationId: getSubtasks
      tags: [subtasks]
      summary: Get subtasks of a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of subtasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createSubtask
      tags: [subtasks]
      summary: Create a subtask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created subtask
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateUserProfile
      tags: [user]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /user/streak:
    post:
      operationId: recordStreak
      tags: [user]
      summary: Record daily activity for streak tracking
      responses:
        "200":
          description: Updated streak info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakInfo"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get productivity statistics overview
      responses:
        "200":
          description: Stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/weekly:
    get:
      operationId: getWeeklyStats
      tags: [stats]
      summary: Get weekly task completion stats
      responses:
        "200":
          description: Weekly stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayStat"

  /stats/by-category:
    get:
      operationId: getStatsByCategory
      tags: [stats]
      summary: Get task counts grouped by category
      responses:
        "200":
          description: Category stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"

  /quotes/daily:
    get:
      operationId: getDailyQuote
      tags: [quotes]
      summary: Get the motivational quote of the day
      responses:
        "200":
          description: Daily quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [high, medium, low]
        category:
          type: string
          enum: [study, work, personal, health, finance, hobby, social]
        completed:
          type: boolean
        dueDate:
          type: string
          nullable: true
        parentId:
          type: integer
          nullable: true
        subtaskCount:
          type: integer
        completedSubtaskCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - priority
        - category
        - completed
        - subtaskCount
        - completedSubtaskCount
        - createdAt
        - updatedAt

    CreateTaskBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [high, medium, low]
          default: medium
        category:
          type: string
          enum: [study, work, personal, health, finance, hobby, social]
          default: study
        dueDate:
          type: string
          nullable: true
        parentId:
          type: integer
          nullable: true
      required:
        - title

    UpdateTaskBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [high, medium, low]
        category:
          type: string
          enum: [study, work, personal, health, finance, hobby, social]
        dueDate:
          type: string
          nullable: true

    ToggleCompleteBody:
      type: object
      properties:
        completed:
          type: boolean
      required:
        - completed

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        streakDays:
          type: integer
        lastActiveDate:
          type: string
          nullable: true
        totalTasksCompleted:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - streakDays
        - totalTasksCompleted
        - createdAt

    UpdateUserProfileBody:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    StreakInfo:
      type: object
      properties:
        streakDays:
          type: integer
        lastActiveDate:
          type: string
        isNewDay:
          type: boolean
      required:
        - streakDays
        - lastActiveDate
        - isNewDay

    StatsOverview:
      type: object
      properties:
        totalTasks:
          type: integer
        completedTasks:
          type: integer
        pendingTasks:
          type: integer
        overdueTasks:
          type: integer
        completionRate:
          type: number
        streakDays:
          type: integer
        todayCompleted:
          type: integer
        todayTarget:
          type: integer
      required:
        - totalTasks
        - completedTasks
        - pendingTasks
        - overdueTasks
        - completionRate
        - streakDays
        - todayCompleted
        - todayTarget

    DayStat:
      type: object
      properties:
        date:
          type: string
        dayName:
          type: string
        completed:
          type: integer
        created:
          type: integer
      required:
        - date
        - dayName
        - completed
        - created

    CategoryStat:
      type: object
      properties:
        category:
          type: string
        total:
          type: integer
        completed:
          type: integer
        pending:
          type: integer
      required:
        - category
        - total
        - completed
        - pending

    Quote:
      type: object
      properties:
        text:
          type: string
        author:
          type: string
        date:
          type: string
      required:
        - text
        - author
        - date
